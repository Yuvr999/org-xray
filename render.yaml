# =============================================================================
# ORG-XRAY — Render Blueprint (Infrastructure as Code)
# Deploy: Push to GitHub → Render Dashboard → New Blueprint Instance → Connect repo
# NOTE: No managed DB — API uses SQLite (free, zero-config, no free-tier limit)
# =============================================================================

services:
  # ─── FastAPI Backend ───────────────────────────────────────────────
  - type: web
    name: org-xray-api
    runtime: python
    region: oregon
    plan: free            # Free tier: 750 hrs/month, sleeps after 15 min idle
    rootDir: apps/api
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/v1/health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: SECRET_KEY
        generateValue: true   # Render auto-generates a secure random string
      - key: GEMINI_API_KEY
        sync: false           # You'll set this manually in the dashboard
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: DATABASE_URL
        value: sqlite:///./org_xray.db   # SQLite — no external DB needed
      - key: CORS_ORIGINS
        value: https://org-xray-web-ylo3.onrender.com,https://org-xray-web.onrender.com,http://localhost:5173
      - key: RENDER_EXTERNAL_URL
        value: https://org-xray-web-ylo3.onrender.com
      - key: STORAGE_BACKEND
        value: local
      - key: LOG_LEVEL
        value: INFO

  # ─── React Frontend (Static Site) ─────────────────────────────────
  - type: web
    name: org-xray-web
    runtime: static
    rootDir: apps/web
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://org-xray-api-ylo3.onrender.com
      - key: NODE_VERSION
        value: 20.18.0
